name: daily-summary

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily summary
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
          CRON_SECRET: ${{ secrets.RENDER_CRON_SECRET }}
        run: |
          curl -m 60 -sS --fail-with-body -X POST "${API_URL}/cron/daily-summary" \
            -H "Authorization: Bearer ${CRON_SECRET}"