# Octave Chime — Render Blueprint
# Applies: Express API (web service).
# The daily summary is scheduled by GitHub Actions
# (.github/workflows/daily-summary.yml), not by a Render cron.
# Secrets and deploy-time URLs are sync:false — fill them once in the Render
# dashboard after the first apply (see root README deploy section).

services:
  - type: web
    name: octave-chime-api
    runtime: node
    rootDir: api
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm db:deploy
    startCommand: node dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: TERMII_MODE
        value: mock
      - key: MONO_MODE
        value: off